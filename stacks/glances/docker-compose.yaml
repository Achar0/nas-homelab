services:
  glances:
    image: nicolargo/glances:latest
    container_name: glances-61208
    restart: unless-stopped
    pid: host            # see host processes
    network_mode: host   # see the real eth0 traffic
    environment:
      GLANCES_OPT: "-w --password"  # web server + REST API on :61208, login needed (user "glances")
      TZ: Europe/Rome
    volumes:
      - /etc/os-release:/etc/os-release:ro
      - /volume1:/volume1:ro   # so it can report free space on the RAID volume
      - ./data:/root/.config/glances   # glances.pwd, the password hash (see README; not in git)
