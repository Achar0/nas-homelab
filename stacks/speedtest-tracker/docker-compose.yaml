services:
  speedtest-tracker:
    image: lscr.io/linuxserver/speedtest-tracker:latest
    container_name: speedtest-tracker-8765
    restart: unless-stopped
    network_mode: bridge
    ports:
      - "8765:80"
    env_file: .env                 # APP_KEY (encryption key, keep private)
    environment:
      PUID: 1000
      PGID: 10
      TZ: Europe/Rome
      DB_CONNECTION: sqlite
      APP_URL: http://192.168.1.14:8765
      APP_TIMEZONE: Europe/Rome
      DISPLAY_TIMEZONE: Europe/Rome
      SPEEDTEST_SCHEDULE: "0 */6 * * *"   # every 6 hours
      PRUNE_RESULTS_OLDER_THAN: 365        # keep one year of history
    volumes:
      - ./config:/config
