# Mission Control: what Prometheus collects, every 15 s (kept 365 days)
global:
  scrape_interval: 15s
scrape_configs:
  - job_name: node        # CPU, memory, temps, disk I/O, network, RAID
    static_configs: [{targets: ["127.0.0.1:9100"]}]
  - job_name: smart       # drive health (SMART)
    static_configs: [{targets: ["127.0.0.1:9633"]}]
  - job_name: collector   # containers + hosted services (own code)
    static_configs: [{targets: ["127.0.0.1:9101"]}]
