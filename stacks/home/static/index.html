<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <title>Home</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="guest.css">
</head>
<body>
  <main class="guest">
    <header class="g-head">
      <div>
        <h1 id="hello">Hello</h1>
        <p id="today"></p>
      </div>
      <div class="g-actions">
        <a class="g-ugos" id="ugos" target="_blank" rel="noopener"><img src="icons/ugos.png" alt="" width="22" height="22">Open UGOS</a>
        <button class="g-admin" id="admin">Admin</button>
      </div>
    </header>

    <section class="g-status" aria-label="Status">
      <div class="g-state unknown" id="state" aria-live="polite">
        <i aria-hidden="true"></i>
        <div><b id="s-title">Checking…</b><span id="s-detail"></span></div>
      </div>
      <div class="g-num"><span>Internet</span><b id="internet">—</b></div>
      <div class="g-num"><span>Free storage</span><b id="free">—</b></div>
    </section>

    <section class="news" aria-label="News">
      <div class="section-head">
        <h2>News</h2>
        <div class="segmented" role="tablist" aria-label="Topic" id="topics"></div>
        <div class="pager">
          <button class="round" id="prev" aria-label="Previous story">‹</button>
          <span id="count">0 / 0</span>
          <button class="round" id="next" aria-label="Next story">›</button>
        </div>
      </div>
      <div class="deck" id="deck" tabindex="0" aria-roledescription="carousel"><div class="track" id="track"></div></div>
    </section>

    <section class="arrivals" aria-label="Downloads">
      <h2>Downloads</h2>
      <div class="eps" id="eps"></div>
    </section>
  </main>

  <dialog class="g-login" id="login" aria-labelledby="l-title">
    <form id="l-form">
      <b id="l-title">Admin</b>
      <button type="button" class="g-passkey" id="l-passkey" hidden>Sign in with passkey</button>
      <div class="g-or" id="l-or" hidden><span>or</span></div>
      <input id="l-pw" type="password" placeholder="Password" autocomplete="current-password webauthn" aria-label="Password" required>
      <label><input id="l-remember" type="checkbox" checked>Remember this device for 30 days</label>
      <p class="g-error" id="l-error" role="alert"></p>
      <div class="g-login-actions">
        <button type="button" class="g-cancel" id="l-cancel">Cancel</button>
        <button type="submit" class="g-submit" id="l-submit">Log in</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="guest.js"></script>
</body>
</html>
