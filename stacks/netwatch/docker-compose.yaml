services:
  netwatch:
    build: .
    image: netwatch:local
    container_name: netwatch-8790
    restart: unless-stopped
    network_mode: host       # read the NAS's own connection table (/proc/net/tcp)
    env_file:
      - .env                 # NTFY_URL (private ntfy topic for phone alerts, not in git)
    environment:
      PORT: 8790
      NAS_TS_NAME: ${NAS_TS_NAME:-}
      HTTPS_PORT: "8793"
      HOME_URL: http://127.0.0.1:3001
      HOME_LAT: "45.46"      # map "home" point (Milan)
      HOME_LON: "9.19"
      TORRENT_PORT: 6888     # incoming connections here are normal (peers)
      TZ: Europe/Rome
    volumes:
      - ./data:/data         # GeoIP db, blocklists, 24 h history
      - ./static:/app/static:ro   # page files, editable without a rebuild
      - ../admin-auth:/admin-auth:ro   # admin login (not in git); Home writes it
